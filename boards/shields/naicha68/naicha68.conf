# ──────────────────────────────────────────────────────────────────────────────
# my_keyboard.conf
# Kconfig fragment for the my_keyboard ZMK shield.
# Applied on top of the seeeduino_xiao_ble board defaults.
# ──────────────────────────────────────────────────────────────────────────────

# ── Required: I2C bus and PCA9555 GPIO expander driver ───────────────────────
CONFIG_I2C=y
CONFIG_GPIO=y
CONFIG_GPIO_PCA95XX=y       # Zephyr driver covering the entire PCA95xx family

# ── Key-scan debounce ─────────────────────────────────────────────────────────
# These values (5 ms press / 5 ms release) work well with MX and Choc switches.
# Raise them if you see chatter; lower them if the board feels sluggish.
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# ── Power management ──────────────────────────────────────────────────────────
# Put the keyboard to deep sleep after 15 minutes of inactivity (BLE only).
# Wake on any keypress.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000   # milliseconds → 15 minutes

# ── Bluetooth ─────────────────────────────────────────────────────────────────
# Up to 5 paired BLE profiles (profile switching on Fn layer).
CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5

# ── Optional: logging (disable for production to save flash/power) ────────────
# CONFIG_ZMK_LOG_LEVEL_DBG=y   # Uncomment during development
