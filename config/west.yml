manifest:
  defaults:
    revision: v0.3
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: pca9555_bindings_base
      url-base: https://github.com/deltea
    # Additional modules containing boards/shields/custom code can be listed here as well
    # See https://docs.zephyrproject.org/3.2.0/develop/west/manifest.html#projects
  projects:
    - name: zmk
      remote: zmkfirmware
      import: app/west.yml
    - name: pca9555-bindings-module
      remote: pca9555_bindings_base
      revision: main
      import: west.yml
  self:
    path: config
